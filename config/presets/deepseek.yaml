# DeepSeek official endpoint
# Usage: CONFIG=config/presets/deepseek.yaml python main.py web
# Needs DEEPSEEK_API_KEY (LLM) and EMBEDDING_API_KEY (embedding stays on the native DashScope
# endpoint for sparse).
#
# See config/config.example.yaml for field meanings, allowed values and how to add a provider.
# Comments here cover only what the config can't say itself: measured numbers, costs, and one
# safety switch.

llm:
  providers:
    # One account split into two declarations only so scenes can name the fast or strong tier;
    # the shared api_key_env means they spend the same key. Quotas are per model (flash 2500 /
    # pro 500), so rpm sits on each declaration: gates are per endpoint, one gate each.
    deepseek:
      base_url: https://api.deepseek.com/v1
      model: deepseek-flash
      api_key_env: DEEPSEEK_API_KEY
      rpm: 2500
      params:
        # Don't remove: thinking.type defaults to enabled, and thinking shares max_tokens with
        # the answer, so it eats the few-hundred-token per-step cognition budget and truncates
        # into unparseable JSON. To enable it, override in a specific scene's params
        # (reasoning_effort: none/low/high/max).
        thinking:
          type: disabled
    deepseek_pro:
      base_url: https://api.deepseek.com/v1
      model: deepseek-v4-pro
      api_key_env: DEEPSEEK_API_KEY
      rpm: 500
      params:
        thinking:
          type: disabled

  default_provider: deepseek

  scenes:
    persona_generation:
      provider: deepseek_pro
    cast_design:
      provider: deepseek_pro
    world_building:
      provider: deepseek_pro
      # Required. The 60s default can't cover the world build's "thousands of tokens of JSON"; it timed out twice
      timeout: 300
      # No enable_search equivalent: DeepSeek's chat API has no web search, so theme analysis
      # relies on the model's own knowledge. The cost is a thinner world foundation for obscure
      # themes than the DashScope/Zhipu presets give.

  # Judge for offline review (python -m tuning). Deliberately not flash: a model grading its own
  # output grades too leniently.
  judge:
    provider: deepseek_pro

embedding:
  # This dashscope is an implementation name in the embedding registry, a separate namespace from
  # llm.providers. DeepSeek offers no embedding and only native DashScope returns learned sparse,
  # so this axis stays on DashScope.
  provider: dashscope
  params:
    model: text-embedding-v3
    dimension: 1024
    output_type: dense&sparse   # only the native DashScope endpoint returns learned sparse, which hybrid retrieval needs

vector_store:
  provider: file
  params:
    # Clear this directory before changing dimension: upsert raises on a dimension mismatch.
    path: ./data/vectors

agent_store:
  provider: file
  params:
    path: ./data/agents

message:
  provider: in_memory
  params: {}

snapshot:
  provider: file
  params:
    path: ./data/snapshots

# DeepSeek quotas are per model, so rpm lives on each llm.providers entry above and only tpm is
# left here. DeepSeek has no TPM limit, so it stays 0 (off). cooldown is always on to absorb 429s.
# See https://api-docs.deepseek.com/zh-cn/quick_start/rate_limit
rate_limit:
  tpm: 0

world:
  config: tiled
  min_agents: 5
  max_agents: 8

engine:
  max_concurrent_llm: 16
  decay_interval: 5
  event_system_enabled: true
  max_events_per_window: 2
  event_quota_window: 20
  event_check_interval: 6
  main_max_idle_steps: 2
  background_max_idle_steps: 6
  max_npcs: 6                  # the cost is prompt space, not memory: each takes a line in main-character decision prompts

logging:
  level: DEBUG
  fmt: json
  output: stdout+file
  file_path: ./data/logs/asamana.log
  max_size_mb: 20
  backup_count: 5

observability:
  enabled: true
  provider: jsonl
  params:
    base_dir: ./data/traces

web:
  host: 127.0.0.1
  port: 7860
  cors_origins: ["*"]
  # Developer tools (trace viewer / audit / prompt replay) spawn subprocesses and can send any
  # prompt to a paid LLM. Off by default; enable locally with ASAMANA_DEV_TOOLS=true, never in a
  # public deployment.
  dev_tools_enabled: ${ASAMANA_DEV_TOOLS:-false}
