# Audit scoring criteria (configurable). scope → dimension → criteria (a list of one-line red flags).
#
# - The 7 dimensions' names/tiers/weights/audit points are fixed in audit_metrics.DIMENSIONS; scope →
#   dimension coverage is fixed in audit_metrics._SCOPE_DEFS. This file only configures the
#   scoring basis (criteria) for each (scope, dimension) — changing the criteria means editing
#   here, not Python.
# - Each criterion is one sentence describing a failure mode (negative red flag), as a list;
#   no positive examples, no theme-specific names (Rule 7).
# - Not applicable → null: dimensions the judge can't assess for this fragment (finality for a
#   sliced audit, growth when nothing happened, etc.) return null / are omitted and drop out of the
#   weighting. Related criteria are worded accordingly (judge "is it moving toward…", not "has it
#   already…").

single_agent_single_step:
  grounding:
    criteria:
      - "凭空添事实：输出断言了输入里没有的既成事实（某段往事、某个结果、某人生死、某处情形、捏造内容等等）"
      - "凭空添人添物：提到一个输入里从未出现过的人 / 物 / 地点，并当作已知之事对待"
      - "张冠李戴：把输入里属于别人的经历 / 话语 / 处境说成自己的，或反过来"
      - "越过信息差：说出只有别人知道、这次输入从未给他的事"
      - "把别人尚未落定的意图当成已经发生的事去叙述"
      - "时刻对不上：输出里说的时点与这一格给的世界时点矛盾（把还没到的说成已过、把此刻说成别的时辰），或它自己前后给出两个时刻"
      - "时长离谱：把一件事说成花了与「一步多长」明显不相称的时间"
      - "时间顺序混乱：比如当前是1月5号，把明日说出1月4号"
      - "（第一人称的判断、猜测、情绪、意图不需要出处——只罚把**客观事实**说成既成的那种）"
      - "（输入清单是这次调用拿到的**全部**事实；不在清单里而输出当作既成事实的，就是凭空添）"
  instruction_adherence:
    criteria:
      - "跳出角色：第一人称扮演的输出里冒出旁白口吻、评论自己、或提到自己是模型 / 在完成任务"
      - "字段之间自相矛盾：同一份输出里两处说的不是一回事（比如判了成功却又给出没成的缘由；说造成重创却给了零损耗；描述说的是甲而指认的对象是乙）"
      - "答非所问：给的不是这次要它给的东西（该裁定却给建议、该第一人称却写成第三人称记述、该给结论却只复述题面）"
      - "空壳应付：字段填了但没有内容（「无」「不适用」「……」、或把要求原样抄回）"
      - "（**只判输出本身**：能不能选、选得对不对是代码算得出的，已在确定性预检里；此维不据名单扣分）"

single_agent_multi_step:
  persona_worldview:
    criteria:
      - "人设漂移：跨步逐渐偏离人设基线（性格 / 价值观 / 自我认知），到后面已像是另一个人，而中间没有任何足以解释这一转变的经历"
      - "越过硬约束：做了人设里写明『绝不为之』的事，而当下处境并不足以压倒它"
      - "身份不相称：言行与其身份 / 地位 / 年龄该有的分寸、该会的事、该忌讳的全程对不上"
      - "毕生追求失联：整段轨迹与他的长期志向毫无关系，像换了个人在过日子（只判是否相关，不判是否达成）"
      - "（有可指认的经历促成的转变是**成长**，按成长维度评，不在此扣；此维只罚**无因**的变形）"
  causal_coherence:
    criteria:
      - "金鱼脑失忆：前一步深恶痛绝或遭重大丧痛，本步无任何交代便与其欢声笑语，或对刚做完之事毫无记忆"
      - "情绪跨步无诱因突变（如遇挫折却转为喜悦）"
      - "主导需求跨步变化不符合马斯洛层次（生死威胁当前却主导高层需求）"
      - "短期目标变化无因果联系，比如行动明明已经实现了短期目标，但是短期目标并没有标记完成。"
      - "（合法世界变动≠断链/臆造：行动因前置条件在决策后被他人并发改变而失败——决策时目标在场、执行时已离场 / 移动 / 变忙，或物品被他人取走——是信息不对称下的正当结果，恰恰说明 agent 正确感知并合理反应；只要决策时的感知确实支持该决策、失败原因可在其自身认知链中追溯，就不扣。）"
      - "存在关系认知割裂的情况，比如在没有任何特殊情况的前提下，A无缘无故地帮助自己的仇敌等等"
      - "时点错乱：他对某个时刻的说法与步首的世界时点、或与他自己此前记下的时刻对不上（把还没到的说成已过、把已发生的说成将来、同一件事前后给出两个时刻）"
      - "约定的时刻无从核对：定下将来要做的事却只给相对指称（『明日』『过些时候』『稍后』），目标身上也没有引擎盖的到期标记——即根本没定下时刻，只是说说"
  action_efficacy:
    criteria:
      - "死循环转圈：连续多步在物理空间或无意义动作中卡死（如反复开门关门原地打转）"
      - "反复宣称同一意图 / 重复同一行动却无任何新进展——**判据是 agent 实际执行过的行动是否原地打转，不是决策文本是否重复**：只有真正执行了、且执行后毫无进展的重复才算空转。"
      - "（以下重复**不算**空转，是正当坚持而非原地打转：① 本步原决策**因被征召 / 被中断 / 仲裁让渡而未执行**（render 标『本步为被动应答』，或行动与决策不符系让渡所致）——这一意图在后续步重现，是被顺延的**首次真正尝试**，不是重复；② 上一次尝试**已判失败，或前置条件被他人并发改变 / 目标离场而失败**——在**合理次数内（约数步内）**重试同一目标是正当坚持。仅当行动**确已执行、却连续多步机械重复且毫无策略调整或进展**，或**明知目标已离场后仍无意义重复**，才算空转。）"
      - "新旧短期目标意思相近或者相同，或通过细化现有目标生成新的目标。例如，目标意思相近：“我要去上学”，“我去读书了”，目标意思相等“我要去上学”，“我要去上学”，“我要和刘总在公司谈论投资的事情”的子目标“我要先把刘总邀请到公司”。"
      - "到期不兑现：目标已标『约定时刻已过』，此后既没有一步真的去做它，也没有任何交代（没被判失败 / 搁置，也没说明为何做不成），就这么一直挂着"
      - "空头约定：反复定下『到某时做某事』，却一次也没有在那个时刻真的发生——约定只是话术，不落到行动上"
  character_growth:
    criteria:
      - "冷酷木头人：角色经历灭门 / 被挚友背叛等重大剧变后，情绪 / 需求 / 行为模式毫无变化、一成不变"
      - "（窗口内无重大变故可供考察成长时，此维给 null，不要冷扣）"
  dramatic_arc:
    criteria:
      - "工厂流水线日志：该角色全程压力 / 冲突值近乎平直线、无危机或高潮（如每日雷打不动的固定循环）"
      - "（窗口过短、不足以判断弧线时，此维给 null）"

multi_agent_single_step:
  causal_coherence:
    criteria:
      - "信息差被击穿：某 agent 对本步未向其共享、且此前从未感知到的信息做出反应或凭空知晓（如得知他人私密意图、未传达的情报、别处正在发生之事）——破坏信息不对称"
      - "反应错位：某 agent 的感知 / 情绪 / 记忆里对另一 agent 本步行动的反映，与后者实际所做 / 所说不符（张冠李戴、无中生有地回应）"
      - "同环境行动互斥：同一步内多个 agent 的行动在物理 / 逻辑上冲突（如 A 与 B 面对面交谈，B 本步却在别处独立行动；同一不可分对象被两人同时独占 / 支配。但对于【传讯】的情况是不受环境空间限制，也可能不会立即回应甚至不回应，这是符合预期的，可以不扣分。）"
      - "关系反转无铺垫：同处一地的 agent 在无任何征兆 / 挑衅 / 关系恶化铺垫下，突然迫害 / 攻击 / 出卖本方队友（除非有可辨识的策略目的，如苦肉计 / 诈降 / 离间——此时属正当谋略，不算突兀，不扣）"
      - "（并发独立行动≠互斥：agent 各自决策、其一离场 / 移动致另一人计划落空，是正当的并发 + 信息不对称，不扣；『互斥』仅指被锁定的联合互动被违背，如正面对谈者之一却同时在别处。）"
      - "约定对不上：同一个约定在双方口中是两个时刻（一方说定的时刻与另一方记下的不同），而这个约定本就是当面共享过的——信息差不成立"

multi_agent_multi_step:
  narrative_convergence:
    criteria:
      - "各行其是：偏离世界主题，各 agent 做互不相关之事（如主题是聚会，却有人去上班、有人去斗殴）"
      - "全程没有朝各 agent 的长期目标推进"
      - "断电式大乱斗 / 戛然而止：核心冲突到最后仍毫无交代或推进（仅当可判定为完整推演的收尾时据此扣；中途切片无从判断则给 null）"
  dramatic_arc:
    criteria:
      - "全局节奏失控：全程平淡只在最后一刻突然大乱斗；或开局即高潮、随后陷入漫长无聊的垃圾时间"
      - "全局冲突强度曲线全程无起伏张弛"
  emergent_novelty:
    criteria:
      - "俗烂直线剧本：完美符合最老套的走向，全程无误会、无反转、无博弈，毫无由认知差 / 情报差带来的复杂性"
      - "（推演过短、不足以判断趣味时，此维给 null）"
  action_efficacy:
    criteria:
      - "世界级流水账：大量步骤只是平铺记事，行动不推动任何实质的世界 / 关系变化"
  persona_worldview:
    criteria:
      - "已死亡 / 退场的 agent 在后续步骤仍作为行动者出现，或被他人当作在场者感知"
      - "时间线混乱：叙事与时间常识相悖（如深夜集体进行只宜白天的高强度活动且无特殊缘由）"
      - "时序倒错：靠后的步引用了尚未发生的事，或把更早发生的事说成在其之后；世界时点的推进与叙述的先后相悖"

initialization:
  persona_worldview:
    criteria:
      - "关系的年龄与称谓矛盾（按称谓：『兄弟:弟弟』的发起方应比对方年幼，反之矛盾）"
      - "生成的 label 不符合 label 的定义（角色是发起方在该关系中的位置）"
      - "正反向 label 不对应：一方声明的关系类别另一方未回指；非对称角色两侧标成同一个"
      - "角色设定与声明的时代 / 世界观明显违和；存在与核心张力无关、可任意替换的游离角色、不服务于同一主题。"
      - "硬约束（绝不为之）与其性格 / 价值观 / 毕生追求自相矛盾"
      - "初始 / 隐藏需求与角色处境或人设脱节（如身处生死危机却无 safety 类需求；需求与背景毫无关联）"
      - "需求类型不在马斯洛规范五类内，或强度不在 [0,1] / 权重不在 [0.1,2.0]，或取值明显不合理（全零、彼此矛盾）"
      - "开局的物 / 差役与核心张力无关，谁也不会去争、去用、去遣——只是布景；或数量寥寥，世界除了说话无事可做"
      - "差役的定位跑偏：他是**一类**没有心智、只被动照吩咐办事、由特定本事定义的人——被写成某个具体的人（人名，或与某角色实为同一人）、被给了心智（性格 / 立场 / 心事，或打听劝人盯梢这类要心智的本事）、几个差役彼此没有分别，都算跑偏"
  causal_coherence:
    criteria:
      - "历史事件时间线倒错（已完成之事后又出现『计划做同一件事』的更晚事件）"
      - "事件先后与因果相悖；牵涉角色与其身份 / 时空矛盾"
      - "物 / 差役的落位与其身份或与角色的初始处境矛盾（信物不在它该在的人或地方；守某处的人却被放在别处）"
      - "角色的开局站位与其身份或处境矛盾（该守在某处的人不在那儿；本该互不相见的对立方一开局就同处一室，而开局情势并不要求）"
